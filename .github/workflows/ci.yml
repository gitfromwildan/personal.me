name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs Vite+, the Node.js and Bun versions the repo pins, and the dependencies
      # (`vp install`). An exact version, as the Vite+ docs ask: the v1 tag is no longer moved.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      # Format, lint and type-check the .ts files.
      - run: vp check

      # The web app's tests run in real browsers (apps/web/vite.config.ts): Chromium and WebKit.
      # The browsers are kept from run to run, until Playwright moves to a new version.
      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(vpx playwright --version | cut -d" " -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium and WebKit
        id: browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: vpx playwright install --with-deps chromium webkit

      # A kept browser still needs the system libraries WebKit runs on, which live outside it.
      - name: Install the system libraries the browsers need
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: vpx playwright install-deps chromium webkit

      - name: Test
        run: vp run -r test

      # A failed browser test leaves a screenshot of the page in apps/web/.vitest.
      - name: Keep the screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-screenshots
          path: apps/web/.vitest/attachments/
          include-hidden-files: true
          if-no-files-found: ignore

      # Type-checks the .vue files, builds the site and writes every page as HTML.
      - name: Build
        run: vp run build
